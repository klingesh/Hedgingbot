# ---------------------------------------------------------------------------
# Hedgingbot — exposure overlay configuration
#
# Copy to config/hedge_config.yaml (gitignored) and edit.
#   cp config/hedge_config.example.yaml config/hedge_config.yaml
# ---------------------------------------------------------------------------

# "observe" = measure and log ONLY, place no orders. START HERE and stay here
#             for at least a few weeks. It costs nothing and tells you whether
#             the concentration is real before any money is at risk.
# "live"    = actually place hedge orders.
mode: observe

# Belt-and-braces. Even in mode: live, nothing is sent while dry_run is true.
dry_run: true

connection:
  # Blank => attach to whatever account the MT5 terminal is already logged into
  # (same convention as Tradingbot). Fill these ONLY if you need an explicit
  # login, and remember this file is gitignored for that reason.
  login:
  password:
  server:
  path:

# ---------------------------------------------------------------------------
# Risk caps, in LEVERAGE units.
#
#   cap: 1.5  =>  "a 1% adverse move in this factor may cost at most 1.5% of
#                  equity"
#
# HOW TO CHOOSE THESE: do not guess. Run in observe mode, look at the measured
# leverage your book actually runs, and set the cap somewhere below the level
# that produced drawdowns you disliked. A cap above your observed maximum does
# nothing at all; a cap far below it will hedge constantly and bleed spread.
#
# The values below are placeholders chosen to be roughly at the edge of a
# 2%-risk-per-trade, 8-slot book. Replace them with your own measurements.
# ---------------------------------------------------------------------------
caps:
  USD: 1.50      # the dominant shared factor of the Tradingbot portfolio
  RISK: 1.50
  ENERGY: 1.00
  METALS: 1.25

# --- anti-churn band. Read overlay/decision.py before touching these. ------
bands:
  hysteresis: 0.25       # act only above cap * 1.25
  target_fraction: 0.80  # hedge down to cap * 0.80, not to the cap itself
  unwind_band: 0.60      # close the hedge below cap * 0.60
                         # must be <= target_fraction or the overlay churns

limits:
  # Total hedge notional ceiling, as a % of EQUITY. Deliberately large: leveraged
  # CFD notional is inherently many times equity. One lot of EURUSD is ~108,000
  # of notional, so on a 10,000 account a 200% ceiling (=20,000) would cap the
  # overlay at 0.18 lots and it would spend its life refusing to hedge.
  # CALIBRATE THIS from the gross_notional that observe mode reports for your book.
  max_hedge_gross_pct: 1000.0
  min_purity: 0.50             # a hedge leg must be at least this single-factor
  min_abs_beta: 0.20           # ...and at least this sensitive to the factor
  max_actions_per_cycle: 1     # one change per cycle, then let it settle
  max_hedges_per_day: 6        # hard brake on churn; overlay stops acting after this
  # A hedge must remove at least this fraction of the EXCESS leverage, or the
  # overlay refuses and tells you to reduce the position instead.
  #
  # This exists because of a real measurement: a 1-lot short gold position on a
  # 10.5k account produced USD leverage of +43x against a 1.50x cap. The largest
  # hedge the gross ceiling allowed (0.90 lots EURUSD) reached +33.7x — removing
  # 22% of the excess, leaving the book 22x over cap, and costing ~3.4% of equity
  # per month in swap. A token hedge is worse than none: it bills you monthly for
  # the impression that the risk was handled. An overlay cannot fix position
  # sizing and should say so rather than pretend.
  min_excess_removed: 0.50
  allow_unmapped: false        # false => refuse to hedge if any open symbol
                               # has no betas. Keep it false.

# ---------------------------------------------------------------------------
# Beta estimation
# ---------------------------------------------------------------------------
betas:
  # Where estimate_betas.py writes, and where the live overlay reads.
  path: betas/betas_latest.json
  # Refuse to trade on betas older than this. Correlations regime-shift; a
  # six-month-old beta is a guess wearing a lab coat.
  max_age_days: 30
  history_years: 8
  # NOTE: halflife_days and min_obs are counted in PERIODS, not calendar days.
  # On a weekly run, 250 "min_obs" would demand 5 years of data. estimate_betas.py
  # scales its own defaults by the return period; these keys are only read by
  # tooling that overrides them explicitly.
  halflife_days: 252     # recent data weighted more heavily. null => equal weight
  winsorize: 0.005       # clip 0.5% from each return tail (NATGAS spikes)
  min_obs: 250
  # Recommended: run with --return-period weekly. Daily FX betas are attenuated
  # ~45% because Yahoo FX spot and futures are snapshotted hours apart.
  return_period: weekly

# ---------------------------------------------------------------------------
# Hedge instruments.
#
# THE KEY IS NOT COSMETIC. Keys must exactly match the logical names in
# HEDGE_CANDIDATES / TRADINGBOT_PORTFOLIO in src/factors/definitions.py, because
# that is how betas are looked up. Writing `US500:` instead of `SP500:` makes the
# candidate invisible to the beta book, and the overlay then reports
# "NO usable hedge instrument" for RISK even though US500 would hedge it fine.
#
#   key   = logical name (must match definitions.py)
#   value = YOUR broker's symbol (confirm with check_account_mode.py)
#
# Values below are JustMarkets ECN names confirmed against a live demo account.
# ---------------------------------------------------------------------------
# Betas below are from a WEEKLY estimation run (--return-period weekly) on 8
# years of history. Weekly rather than daily because Yahoo's FX spot series and
# its futures series are snapshotted at different times of day, which attenuates
# daily FX betas by roughly half. See the synchronicity check in
# scripts/estimate_betas.py.
hedge_instruments:
  EURUSD: EURUSD.ecn      # USD lever    — beta -0.96, purity 1.00
  SP500: US500.ecn        # RISK lever   — beta +0.92, purity 0.87
  WTI: WTI.ecn            # ENERGY lever — beta +0.98, purity 0.97
  SILVER: XAGUSD.ecn      # METALS lever — beta +1.44, purity 0.69

# The trader's own symbols. The overlay will NOT trade these. Same key rule
# applies.
#
# NOTE: JustMarkets does NOT use NGAS / UKOIL / USOIL. The real names are
# XNGUSD, BRENT and WTI. Confirm yours rather than copying these.
trader_symbols:
  GOLD: XAUUSD.ecn
  SILVER: XAGUSD.ecn
  PLATINUM: XPTUSD.ecn
  NATGAS: XNGUSD.ecn
  BRENT: BRENT.ecn
  GBPJPY: GBPJPY.ecn
  AUDUSD: AUDUSD.ecn
  USDJPY: USDJPY.ecn

run:
  # MUST differ from Tradingbot's 990011, so each bot can identify its own
  # positions via magic while still seeing the other's.
  magic_number: 990012
  poll_seconds: 60
  # MUST differ from Tradingbot's logs/bot.lock or the two bots cannot coexist.
  lock_path: logs/hedge.lock
  state_path: logs/portfolio_state.json
  status_path: logs/hedge_status.json
  # Read-only peek at TRADINGBOT's heartbeat, so the overlay can report whether
  # the trader is alive and confirm both bots see the same account.
  #
  # THIS MUST BE AN ABSOLUTE PATH TO THE TRADINGBOT REPO. A relative path
  # resolves against Hedgingbot's own directory, where there is no trader
  # status file, so it silently finds nothing forever.
  #
  # Windows example (forward slashes are fine in YAML and avoid escaping):
  #   trader_status_path: C:/Tradingbot/logs/status.json
  trader_status_path: C:/Tradingbot/logs/status.json
